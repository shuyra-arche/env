[package]
name = "env"
version = "0.1.0"
edition = "2024"

[lib]
test = false
bench = false
doctest = false

[workspace]
resolver = "3"
members = ["initrd"]

# 运行时只有一条边：兼容外壳 → Kernel 权威包。定义不在本仓。
[dependencies]
kernel-api-env = { git = "https://github.com/shuyra-arche/kernel.git", rev = "a9986c82127cf25183bf5c30e7d42e4a9376b734" }

# 判据用（不进运行时图）：伞包路径与 writer 侧 byte codec 必须是同一枚类型/trait。
[dev-dependencies]
env-initrd = { path = "initrd" }
kernel-api = { git = "https://github.com/shuyra-arche/kernel.git", rev = "a9986c82127cf25183bf5c30e7d42e4a9376b734" }
kernel-api-wire = { git = "https://github.com/shuyra-arche/kernel.git", rev = "a9986c82127cf25183bf5c30e7d42e4a9376b734" }
